name: cicd

on:
  push:
    branches:
      - main

jobs:
  setup-java:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Recuperer code source
        uses: actions/checkout@v7

      - name: Configurer JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Installer CodeQL
        uses: github/codeql-action/init@v4.39.0
        with:
          languages: java-kotlin

      - name: Cnstruire avec Maven
        run: mvn -B clean package -DskipTests

      - name: Sauvegarder le rapport Jacoco

        if: ${{ success() || failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco

      - name: Analyser avec CodeQL
        uses: github/codeql-action/analyze@v4.39.0