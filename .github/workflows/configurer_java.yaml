name: Configuration Java

on:
  workflow_dispatch:

jobs:
  affichage:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v7

      - name: Afficher la liste des fichiers
        run: ls -la

      - name: Configurer JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Afficher la version de Java
        run: java -version

      - name: Afficher la version de Maven
        run: mvn -version